services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: second_brain
      POSTGRES_PASSWORD: second_brain
      POSTGRES_DB: second_brain
    ports:
      - "5432:5432"
    volumes:
      - second_brain_pgdata:/var/lib/postgresql/data
volumes:
  second_brain_pgdata:
