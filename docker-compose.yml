services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: second_brain_postgres
    environment:
      POSTGRES_USER: second_brain
      POSTGRES_PASSWORD: second_brain
      POSTGRES_DB: second_brain
    ports:
      # host 5432: this machine already has an unrelated postgres container on 5432
      - "5432:5432"
    volumes:
      - second_brain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U second_brain -d second_brain"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - pg_network

  postgres_backup:
    build: ./docker/postgres-backup
    container_name: second_brain_postgres_backup
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: second_brain
      PGPASSWORD: second_brain
      BACKUP_DATABASE: ${POSTGRES_BACKUP_DATABASE:-second_brain}
    volumes:
      - ${POSTGRES_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pg_network
    restart: unless-stopped

  pg_admin:
    image: dpage/pgadmin4:latest
    container_name: second_brain_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=salas
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - pg_network

  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: second_brain_seaweedfs
    ports:
      - "8333:8333"
    entrypoint: /bin/sh -c
    # dev-only credentials, not real secrets
    command: |
      "mkdir -p /etc/seaweedfs && echo '{
        \"identities\": [
          {
            \"name\": \"second_brain\",
            \"credentials\": [
              {
                \"accessKey\": \"second_brain\",
                \"secretKey\": \"second_brain_dev_secret\"
              }
            ],
            \"actions\": [
              \"Admin\",
              \"Read\",
              \"Write\",
              \"List\",
              \"Tagging\"
            ]
          }
        ]
      }' > /etc/seaweedfs/config.json && \
      weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/config.json"
    volumes:
      - second_brain_seaweed_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Web-based Admin UI for SeaweedFS: browse buckets/files (with inline
  # image/PDF preview), inspect cluster topology/volumes, etc. Same tag as
  # `seaweedfs` above to guarantee wire-protocol compatibility. Bound to
  # 127.0.0.1 only — open http://localhost:23646 in a browser to use it.
  # Change the default admin/admin login via SEAWEEDFS_ADMIN_USER /
  # SEAWEEDFS_ADMIN_PASSWORD env vars (e.g. in a local .env override).
  seaweedfs-admin:
    image: chrislusf/seaweedfs:latest
    container_name: second_brain_seaweedfs_admin
    command: >-
      admin -port=23646 -master=second_brain_seaweedfs:9333 -dataDir=/data
      -adminUser=${SEAWEEDFS_ADMIN_USER:-admin}
      -adminPassword=${SEAWEEDFS_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:23646:23646"
    volumes:
      - second_brain_seaweedfs_admin_data:/data
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  # Periodically backs up the "second-brain" SeaweedFS bucket to a
  # local timestamped tar.gz under ./backups/s3/. Runs once immediately,
  # then repeats every S3_BACKUP_INTERVAL_DAYS (default 30, override via
  # a .env S3_BACKUP_INTERVAL_DAYS=<days>).
  s3-backup:
    build:
      context: .
      dockerfile: docker/seaweedfs-backup/Dockerfile
    command: ["--loop"]
    environment:
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_CONFIG_PATH: /app/s3.json
      S3_BACKUP_INTERVAL_DAYS: ${S3_BACKUP_INTERVAL_DAYS:-30}
    volumes:
      - ./docker/seaweedfs-backup/s3.json:/app/s3.json:ro
      - ./backups/s3:/app/backups/s3
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

volumes:
  second_brain_pgdata:
  second_brain_seaweed_data:
  second_brain_seaweedfs_admin_data:
  pgadmin_data:

networks:
  pg_network:
    driver: bridge